name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unit tests (no provider calls)
        run: python3 -B -m unittest discover -s tests -v
      - name: Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Secret patterns in Git history
        run: python3 scripts/check-secrets.py
      - name: Isolated Docker smoke test
        run: python3 tests/smoke.py
