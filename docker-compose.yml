name: searxng

x-router-build: &router-build
  context: .
  dockerfile: router/Dockerfile

x-searxng: &searxng
  image: docker.io/searxng/searxng:${SEARXNG_VERSION:-latest@sha256:b36af7984b87191b595bc5301418ed6432c047668a4547ab531a7439b816fac3}
  restart: unless-stopped
  environment:
    FORCE_OWNERSHIP: "false"
    SEARXNG_PORT: "8080"
  healthcheck:
    test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/config"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  init:
    build: *router-build
    user: "0:0"
    env_file: ./.env
    command: ["python", "/app/scripts/render-settings.py"]
    environment:
      CONFIG_OUTPUT: /config
    volumes:
      - runtime-config:/config
    network_mode: none
    restart: "no"

  core:
    <<: *searxng
    networks:
      default:
        aliases: [searxng-core]
    ports:
      - "${SEARXNG_HOST:-127.0.0.1}:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - runtime-config:/etc/searxng:ro
      - core-data:/var/cache/searxng
    environment:
      FORCE_OWNERSHIP: "false"
      SEARXNG_PORT: "8080"
      SEARXNG_SETTINGS_PATH: /etc/searxng/core/settings.yml
      __SEARXNG_CONFIG_PATH: /etc/searxng/core
    depends_on:
      init:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  backend:
    <<: *searxng
    networks:
      default:
        aliases: [searxng-backend]
    volumes:
      - runtime-config:/etc/searxng:ro
      - backend-data:/var/cache/searxng
    environment:
      FORCE_OWNERSHIP: "false"
      SEARXNG_PORT: "8080"
      SEARXNG_SETTINGS_PATH: /etc/searxng/backend/settings.yml
      __SEARXNG_CONFIG_PATH: /etc/searxng/backend
    depends_on:
      init:
        condition: service_completed_successfully

  router:
    build: *router-build
    networks:
      default:
        aliases: [searxng-router]
    restart: unless-stopped
    env_file: ./.env
    environment:
      SEARXNG_URL: http://core:8080
      VALKEY_HOST: valkey
      ROUTER_PORT: "8090"
      PACKS_FILE: /config/packs.json
    ports:
      - "${SEARXNG_HOST:-127.0.0.1}:${ROUTER_PORT:-8090}:8090"
    volumes:
      - runtime-config:/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      core:
        condition: service_healthy
      valkey:
        condition: service_started

  valkey:
    image: docker.io/valkey/valkey:9-alpine@sha256:a174b894902bd3367e330d47cc2054367dc4917701776aaf336f41d83b65ec7a
    networks:
      default:
        aliases: [searxng-valkey]
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - valkey-data:/data

volumes:
  runtime-config:
  core-data:
  backend-data:
  valkey-data:
