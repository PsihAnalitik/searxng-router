# Бэкенд для доменных пакетов: обычный SearXNG без пакетов-движков.
# Нужен потому, что движок, обращающийся к своему же инстансу, получает
# нерелевантную выдачу — рекурсивный запрос внутри идущего поиска ломается.
use_default_settings: true

general:
  instance_name: "SearXNG backend"

search:
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  suspended_times:
    SearxEngineCaptcha: 300
    SearxEngineTooManyRequests: 120
    SearxEngineAccessDenied: 300

server:
  limiter: false
  public_instance: false
  image_proxy: false

outgoing:
  request_timeout: 6.0
  max_request_timeout: 15.0

engines:
  - name: google
    disabled: false
  - name: yandex
    disabled: false
    timeout: 12.0
  - name: mycse
    engine: google_cse
    shortcut: my
    categories: [general]
    CX: "f6c2c79a1cb9b40ca"
    timeout: 15.0
