# Настройки локального инстанса. Всё, что не указано, берётся из дефолтов SearXNG:
# https://github.com/searxng/searxng/blob/master/searx/settings.yml
#
# Состав движков и доменных пакетов подобран по измерениям на этой машине,
# Доступность зависит от сети пользователя. Исторические наблюдения:
#   - google (!go) держит site: вместе с OR и выдержал 15 запросов подряд -> на нём пакеты;
#   - bing игнорирует site:, поэтому для пакетов не годится;
#   - brave / startpage / duckduckgo / mojeek / wikidata / arch linux wiki /
#     semantic scholar стабильно отдают CAPTCHA, 403 или timeout -> выключены;
#   - google cse (публичный CX) и свой CSE упираются в отсечку после 6-8 запросов.

use_default_settings: true

general:
  instance_name: "SearXNG (local)"
  # Необязательные метрики бесплатных движков. Бюджет Tavily ведёт router.
  # Без пароля эндпоинт отключён.
  open_metrics: __METRICS_PASSWORD__

search:
  # json нужен агентам: дефолт SearXNG отдаёт только html.
  formats:
    - html
    - json
  safe_search: 0
  autocomplete: ""
  # qwant исключён из доменных пакетов намеренно: на кириллическом запросе с site:
  # он возвращает спам-домены (ah.dj, wupewwi.az) вместо фильтрации по домену,
  # то есть выдаёт мусор под видом результата. На латинице фильтрует корректно.
  # Дефолт подвешивает движок после CAPTCHA на 3600 с — для локального инстанса это
  # означает, что один неудачный запрос выбивает google на час и доменные пакеты
  # перестают работать. Причину (антибот на стороне Google) это не убирает,
  # но возвращает движок в строй за разумное время.
  suspended_times:
    SearxEngineCaptcha: 300
    SearxEngineTooManyRequests: 120
    SearxEngineAccessDenied: 300

server:
  secret_key: __SEARXNG_SECRET__
  # Инстанс слушает только 127.0.0.1 на хосте, рейт-лимитер не нужен и мешает агенту.
  limiter: false
  public_instance: false
  image_proxy: false
  # Генерируется при запуске; SEARXNG_SECRET позволяет задать свой.

valkey:
  url: valkey://valkey:6379/0

outgoing:
  # Дефолтные 3 секунды рвали медленные движки на полпути; 6 заметно снижает долю timeout.
  request_timeout: 6.0
  max_request_timeout: 15.0

engines:

  # ─────────────────────────── общий веб ───────────────────────────
  # Выдержали 15 запросов подряд без единого отказа (limits.py).

  - name: google
    disabled: false
  - name: yandex
    disabled: false
    # Отвечает медленнее общего лимита в 6 с и без этого регулярно рвётся по таймауту,
    # хотя выдачу отдаёт. Он же резерв доменных пакетов, когда google ловит CAPTCHA.
    timeout: 12.0
  - name: qwant
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo web
    disabled: false

  # Стабильно недоступны из этой сети — выключены, чтобы не тормозить выдачу
  # и не засорять unresponsive_engines.
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: mojeek
    disabled: true
  - name: wikidata
    disabled: true
  - name: arch linux wiki
    disabled: true
  - name: semantic scholar
    disabled: true
  - name: baidu
    disabled: true
  # CAPTCHA подвешивает движок на час (suspended_times), выдача от этого рвётся.
  - name: google scholar
    disabled: true

  # ─────────────────────── код и разработка (!it) ───────────────────────
  - name: github
    disabled: false
  - name: gitlab
    disabled: false
  - name: stackoverflow
    disabled: false
  - name: askubuntu
    disabled: false
  - name: superuser
    disabled: false
  - name: hackernews
    disabled: false
  - name: lobste.rs
    disabled: false
  - name: mdn
    disabled: false
  - name: microsoft learn
    disabled: false

  # ─────────────────────────── наука (!science) ───────────────────────────
  - name: arxiv
    disabled: false
  - name: crossref
    disabled: false
  - name: openalex
    disabled: false
  - name: pubmed
    disabled: false

  # ─────────────────────────── погода (!weather) ───────────────────────────
  # Отдают структурированные данные в поле answers, а не в results.
  - name: openmeteo
    disabled: false
  - name: duckduckgo weather
    disabled: false

  # ─────────────────────────── новости (!news) ───────────────────────────
  - name: google news
    disabled: false
  - name: bing news
    disabled: false
  - name: duckduckgo news
    disabled: false

__OPTIONAL_CSE__

  # ─────────────────────────── доменные пакеты ───────────────────────────
  # Каждый пакет — движок json_engine с зашитым site:-фильтром. Запрос уходит в
  # отдельный инстанс searxng-backend, наружу тот не публикуется.
  # language задан явно и обязателен: движок добавляет к запросу заголовок
  # Accept-Language: en-US, из-за которого приёмная сторона ищет по-английски —
  # кириллические запросы давали 0, а латинские возвращали случайные субдомены
  # вместо релевантной выдачи. Параметр language=... перекрывает этот заголовок.
  # Вызывается бангом (!dev) либо параметром engines=<имя>.

  - name: dev sites
    engine: json_engine
    shortcut: dev
    categories: [it]
    enable_http: true
    timeout: 20.0
    search_url: http://backend:8080/search?q={query}+site%3Ahabr.com+OR+site%3Adocs.python.org+OR+site%3Awiki.archlinux.org+OR+site%3Adeveloper.mozilla.org&format=json&language=ru&engines=__PACK_ENGINES__
    results_query: results
    url_query: url
    title_query: title
    content_query: content

